name: Linux build and package
run-name: SWARA XT Linux build/package ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact release revision
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: swaraxt-linux-build-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  build-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REVIEWED_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Preserve LF checkout identity
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify source and initialize pinned submodules
        shell: bash
        run: |
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git -c url.https://github.com/.insteadOf=git://github.com/ submodule update --init --recursive
          git submodule status --recursive
          if git submodule status --recursive | grep -Eq '^[+U-]'; then
            echo "Submodule revision mismatch" >&2
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install pinned build frontend
        shell: bash
        run: |
          python -m pip install --only-binary :all: --require-hashes -r scripts/ci/requirements-frontend.txt
      - name: Native Linux dependencies
        run: bash scripts/ci/setup-linux.sh gcc
      - name: Checkout pinned JUCE 9.0.4
        shell: bash
        run: |
          juce_sha=3fb5cbc0340758596dac39f7c8de47d562b4896e
          mkdir -p .cache
          git -C .cache init JUCE
          git -C .cache/JUCE fetch --depth 1 https://github.com/juce-framework/JUCE.git "$juce_sha"
          git -C .cache/JUCE checkout --detach FETCH_HEAD
          test "$(git -C .cache/JUCE rev-parse HEAD)" = "$juce_sha"
          test -z "$(git -C .cache/JUCE status --porcelain --untracked-files=all --ignored)"
      - name: Configure and build Linux release
        shell: bash
        env:
          CC: gcc
          CXX: g++
        run: |
          g++ --version
          cmake --preset linux-release -DSWARA_BUILD_STANDALONE=ON -DSWARA_BUILD_SKIN_EDITOR=OFF
          cmake --build --preset linux-release --parallel 2
      - name: Package Linux distribution
        shell: bash
        run: |
          SWARAXT_BUILD_DIR="$PWD/build/linux-release" \
          SWARAXT_OUTPUT_DIR="$PWD/artifacts/final-1.3.1" \
          bash scripts/linux/package-release-local.sh
      - name: Upload Linux package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-package-${{ inputs.source_sha }}
          path: |
            artifacts/final-1.3.1/SwaraXT-Linux-x86_64-v1.3.1.tar.gz
            artifacts/final-1.3.1/checksums-v1.3.1.txt
          if-no-files-found: error
          retention-days: 30
