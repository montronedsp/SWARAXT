name: Linux build and package
run-name: SWARA XT Linux build/package ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact release revision
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: swaraxt-linux-build-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REVIEWED_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Preserve LF checkout identity
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify revision
        shell: bash
        run: |
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install pinned build frontend
        shell: bash
        run: python -m pip install --only-binary :all: --require-hashes -r scripts/ci/requirements-frontend.txt
      - name: Native Linux dependencies
        run: bash scripts/ci/setup-linux.sh gcc
      - name: Checkout pinned JUCE 9.0.4
        shell: bash
        run: |
          mkdir -p .cache
          git -C .cache init JUCE
          git -C .cache/JUCE remote add origin https://github.com/juce-framework/JUCE.git
          git -C .cache/JUCE fetch --depth 1 origin 3fb5cbc0340758596dac39f7c8de47d562b4896e
          git -C .cache/JUCE checkout FETCH_HEAD
      - name: Configure and build Linux release
        shell: bash
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release
      - name: Package Linux distribution
        shell: bash
        run: |
          SWARAXT_BUILD_DIR="$PWD/build/linux-release" \
          SWARAXT_OUTPUT_DIR="$PWD/artifacts/final-1.3.1" \
          ./scripts/linux/package-release-local.sh
      - name: Upload Linux package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-package-${{ github.sha }}
          path: |
            artifacts/final-1.3.1/SwaraXT-Linux-x86_64-v1.3.1.tar.gz
            artifacts/final-1.3.1/checksums-v1.3.1.txt
          if-no-files-found: error
          retention-days: 30
