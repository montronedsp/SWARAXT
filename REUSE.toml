version = 1

# Project-owned software, tests, tools, build/docs/config.
# precedence=closest keeps existing file headers (including Emilie Gillet /
# dual-copyright notices) and only fills missing copyright or license tags.
[[annotations]]
path = [
  ".clang-format",
  ".clang-tidy",
  ".editorconfig",
  ".gitattributes",
  ".gitignore",
  ".gitmodules",
  ".github/**",
  "BUILDING.md",
  "CHANGELOG.md",
  "CMakeLists.txt",
  "CMakePresets.json",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "COPYRIGHT",
  "GOVERNANCE.md",
  "README.md",
  "ROADMAP.md",
  "SECURITY.md",
  "THIRD_PARTY_NOTICES.md",
  "cmake/**",
  "docs/**",
  "packaging/**",
  "scripts/**",
  "Source/**",
  "Tests/**",
  "Tools/**",
  "tools/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 MontroneDSP"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Embedded Adriatica Next fonts and in-tree OFL notice (do not modify binaries).
[[annotations]]
path = [
  "resources/Fonts/**",
]
precedence = "closest"
SPDX-FileCopyrightText = [
  "2026 MontroneDSP",
  "2012-2015 The Mozilla Foundation and Telefonica S.A.",
]
SPDX-License-Identifier = "OFL-1.1"

# Adapted Shruthi-1 panel artwork and skin resources (CC BY-SA 3.0).
[[annotations]]
path = [
  "resources/Skin/**",
]
precedence = "closest"
SPDX-FileCopyrightText = [
  "Emilie Gillet / Mutable Instruments",
  "2026 MontroneDSP",
]
SPDX-License-Identifier = "CC-BY-SA-3.0"
